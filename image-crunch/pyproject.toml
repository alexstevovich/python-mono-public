[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alexstevovich-image-crunch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alexstevovich-comfyui-metadata",
    "alexstevovich-image-convert",
]

[tool.uv.sources]
alexstevovich-comfyui-metadata = { workspace = true }
alexstevovich-image-convert = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
