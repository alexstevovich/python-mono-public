[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alexstevovich-video-crunch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["alexstevovich-video-transcode"]

[tool.uv.sources]
alexstevovich-video-transcode = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
