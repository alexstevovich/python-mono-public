[project]
name = "python-mono-public"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "alexstevovich-a1111-metadata",
    "alexstevovich-bit-entropy",
    "alexstevovich-camel-to-snake-keys",
    "alexstevovich-cap-product-volume",
    "alexstevovich-cardinal-power",
    "alexstevovich-comfyui-metadata",
    "alexstevovich-image-convert",
    "alexstevovich-image-crunch",
    "alexstevovich-index-by",
    "alexstevovich-index-by-tags",
    "alexstevovich-is-binary-ext",
