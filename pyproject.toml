    "is-binary-ext",
    "is-file-binary",
    "is-valid-uuid",
    "kebab-to-snake",
    "media-download",
    "reduce-fraction",
    "round-decimal",
    "snake-to-camel-keys",
    "snake-to-kebab",
    "tar-archive",
    "video-crunch",
    "video-transcode",
    "trim-http",
]

